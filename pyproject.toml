[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screener-finance"
version = "0.1.0"
description = "One-request Python API for Indian stock fundamentals from Screener.in"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dhananjay" }]
keywords = ["screener", "india", "stocks", "nse", "bse", "fundamentals", "finance", "investing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pandas>=1.5.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
socks = ["pysocks>=1.7.1"]

[project.scripts]
sfin = "screener_finance.cli:main"

[project.urls]
Homepage = "https://github.com/dhananjaym182/screener-finance"
Issues = "https://github.com/dhananjaym182/screener-finance/issues"

[tool.setuptools.packages.find]
where = ["src"]
